# Nginx para Sinapsis. Reemplace sinapsis.ejemplo.co por el dominio real.
# El certificado se obtiene con: sudo certbot --nginx -d sinapsis.ejemplo.co
server {
    listen 80;
    server_name sinapsis.ejemplo.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sinapsis.ejemplo.co;

    ssl_certificate     /etc/letsencrypt/live/sinapsis.ejemplo.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sinapsis.ejemplo.co/privkey.pem;

    # Fotos de hasta 8 MB, PDF de hasta 20 MB y Excel de hasta 15 MB.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # La cámara solo se permite para este mismo sitio.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # la consulta con IA puede tardar unos segundos
    }
}
